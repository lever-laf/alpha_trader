name: 시세 갱신

# 매 평일 한국시간 08:00 에 전일 종가 기준으로 수익률을 다시 계산한다.
# 제출이 없어도 돌아가므로 대시보드는 항상 최신 상태가 된다.
on:
  schedule:
    - cron: "0 23 * * 1-5"     # 23:00 UTC = 다음날 08:00 KST (미국·한국 전일 종가 확정 후)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 종가 조회 + 수익률 계산
        run: python3 tools/prices.py | tee .summary.md

      - name: 요약
        if: always()
        run: cat .summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: 변경분 커밋
        if: always()
        run: |
          rm -f .summary.md
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "시세 갱신 $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
