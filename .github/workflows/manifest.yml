name: 제출 검증

# 멤버가 data/members/ 에 JSON 을 올리면 검증하고, 통과하면 수익률까지 다시 계산한다.
# 검증에 걸리면 커밋에 실패 표시가 뜨고, 요약에 무엇을 고쳐야 하는지 적힌다.
on:
  push:
    paths:
      - "data/members/**"
      - "data/instruments.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 제출 검증 + manifest 재생성
        id: validate
        continue-on-error: true
        run: python3 tools/validate.py

      # 검증에 걸린 제출이 있어도 돌린다. 계산기는 문제가 있는 멤버만 보류하므로
      # 한 사람의 오류로 나머지 멤버의 수익률까지 멈추지 않게 한다.
      - name: 수익률 재계산
        if: always()
        continue-on-error: true
        run: python3 tools/prices.py | tee -a .summary.md

      - name: 요약
        if: always()
        run: cat .summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: 변경분 커밋
        if: always()
        run: |
          rm -f .summary.md
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신 [skip ci]"
            git push
          fi

      - name: 검증 실패 반영
        if: steps.validate.outcome != 'success'
        run: |
          echo "제출 검증에 걸린 항목이 있습니다. 위 요약을 확인하세요."
          exit 1
